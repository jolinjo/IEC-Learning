<svg xmlns="http://www.w3.org/2000/svg" viewBox="-26.0 -15.0 52.0 30.0" width="156">
  <style>
    g.sym { stroke:#3f3f3f; fill:none; stroke-linecap:round; stroke-linejoin:round }
    g.sym text { stroke:none; fill:#3f3f3f }
    @media (prefers-color-scheme: dark) {
      g.sym { stroke:#c9c9c9 }
      g.sym text { fill:#c9c9c9 }
    }
  </style>
  <g class="sym">
    <line x1="20.0" y1="0.0" x2="3.0" y2="0.0" stroke-width="1.0"/>
    <line x1="-3.0" y1="0.0" x2="-20.0" y2="0.0" stroke-width="1.0"/>
    <line x1="-3.0" y1="-9.0" x2="-3.0" y2="9.0" stroke-width="1.0"/>
    <rect x="0.0" y="-6.0" width="3.0" height="12.0" stroke-width="1.0"/>
    <text x="6.0" y="9.1" font-size="6.6" font-family="sans-serif">-</text>
    <text x="-11.0" y="9.1" font-size="6.6" font-family="sans-serif">+</text>
  </g>
</svg>
