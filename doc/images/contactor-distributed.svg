<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" width="420">
  <g stroke="#8a8a8a" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- 動力側:三極主接點 -->
    <line x1="40" y1="28" x2="40" y2="62"/>
    <line x1="70" y1="28" x2="70" y2="62"/>
    <line x1="100" y1="28" x2="100" y2="62"/>
    <line x1="40" y1="82" x2="40" y2="120"/>
    <line x1="70" y1="82" x2="70" y2="120"/>
    <line x1="100" y1="82" x2="100" y2="120"/>
    <line x1="40" y1="82" x2="54" y2="58"/>
    <line x1="70" y1="82" x2="84" y2="58"/>
    <line x1="100" y1="82" x2="114" y2="58"/>
    <!-- 機械連動虛線 -->
    <line x1="34" y1="71" x2="120" y2="71" stroke-dasharray="5 4" stroke-width="1.8"/>
    <!-- 控制側:線圈 -->
    <line x1="250" y1="28" x2="250" y2="55"/>
    <rect x="228" y="55" width="44" height="30"/>
    <line x1="250" y1="85" x2="250" y2="112"/>
  </g>
  <g fill="#8a8a8a" font-family="sans-serif" font-size="13">
    <text x="34" y="18">L1</text>
    <text x="64" y="18">L2</text>
    <text x="94" y="18">L3</text>
    <text x="35" y="140">U</text>
    <text x="65" y="140">V</text>
    <text x="95" y="140">W</text>
    <text x="256" y="45">A1</text>
    <text x="256" y="105">A2</text>
    <text x="278" y="75" font-weight="bold">-QA2</text>
    <text x="180" y="140">接點鏡像：</text>
    <text x="180" y="158">1-2 3-4 5-6 → /1.1</text>
    <text x="180" y="176">13-14 → /1.5</text>
  </g>
  <g fill="#8a8a8a" font-family="sans-serif" font-size="11">
    <text x="26" y="170">動力迴路（三極同動）</text>
    <text x="196" y="118" font-size="0"> </text>
  </g>
</svg>
