    <line x1="-6.0" y1="0.0" x2="5.0" y2="0.0" stroke-width="1.0"/>
    <line x1="-14.0" y1="0.0" x2="-10.0" y2="0.0" stroke-width="1.0"/>
    <line x1="0.0" y1="-14.0" x2="0.0" y2="-10.0" stroke-width="1.0"/>
    <line x1="10.0" y1="0.0" x2="14.0" y2="0.0" stroke-width="1.0"/>
    <line x1="0.0" y1="10.0" x2="0.0" y2="14.0" stroke-width="1.0"/>
