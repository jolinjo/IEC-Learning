<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="66">
  <style>
    g.sym { stroke:#3f3f3f; fill:none; stroke-linecap:round; stroke-linejoin:round }
    g.sym text { stroke:none; fill:#3f3f3f }
    g.sym .solid { fill:#3f3f3f; stroke:none }
    @media (prefers-color-scheme: dark) {
      g.sym { stroke:#c9c9c9 }
      g.sym text { fill:#c9c9c9 }
      g.sym .solid { fill:#c9c9c9 }
    }
  </style>
  <g class="sym" stroke-width="1.8">
    <path d="M 20 12 A 16 16 0 0 0 20 48"/>
    <line x1="20" y1="12" x2="20" y2="48"/>
    <line x1="20" y1="30" x2="48" y2="30"/>
  </g>
</svg>
