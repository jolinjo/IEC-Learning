<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 132" width="660">
  <style>
    g.sym { stroke:#3f3f3f; fill:none; stroke-linecap:round }
    .dot { fill:#3f3f3f; stroke:none }
    text { fill:#3f3f3f; font-family:sans-serif; stroke:none }
    rect.num { stroke:#3f3f3f; fill:none }
    @media (prefers-color-scheme: dark) {
      g.sym { stroke:#c9c9c9 } .dot { fill:#c9c9c9 } text { fill:#c9c9c9 } rect.num { stroke:#c9c9c9 }
    }
  </style>
  <text x="2" y="66" font-size="9">控制電源</text>
  <g class="sym" stroke-width="1.6">
    <line x1="56" y1="62" x2="120" y2="62"/>
    <!-- 停止鈕 NC -->
    <line x1="156" y1="62" x2="120" y2="50"/>
    <line x1="120" y1="50" x2="120" y2="62"/>
    <line x1="156" y1="62" x2="200" y2="62"/>
    <!-- 並聯段 -->
    <line x1="200" y1="40" x2="200" y2="84"/>
    <line x1="340" y1="40" x2="340" y2="84"/>
    <line x1="200" y1="40" x2="248" y2="40"/>
    <line x1="288" y1="40" x2="252" y2="28"/>
    <line x1="288" y1="40" x2="340" y2="40"/>
    <line x1="200" y1="84" x2="248" y2="84"/>
    <line x1="288" y1="84" x2="252" y2="72"/>
    <line x1="288" y1="84" x2="340" y2="84"/>
    <line x1="340" y1="62" x2="374" y2="62"/>
    <!-- 線圈 -->
    <circle cx="396" cy="62" r="22"/>
    <line x1="418" y1="62" x2="508" y2="62"/>
  </g>
  <circle class="dot" cx="200" cy="62" r="3"/>
  <circle class="dot" cx="340" cy="62" r="3"/>
  <!-- 線號標籤 -->
  <rect class="num" x="80" y="38" width="16" height="16" rx="3"/>
  <text x="88" y="50" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <rect class="num" x="170" y="38" width="16" height="16" rx="3"/>
  <text x="178" y="50" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <rect class="num" x="348" y="38" width="16" height="16" rx="3"/>
  <text x="356" y="50" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <rect class="num" x="454" y="38" width="16" height="16" rx="3"/>
  <text x="462" y="50" font-size="10" font-weight="bold" text-anchor="middle">0</text>
  <!-- 元件標籤 -->
  <text x="138" y="34" font-size="9" text-anchor="middle">-SF2 停止</text>
  <text x="268" y="18" font-size="9" text-anchor="middle">-SF1 啟動</text>
  <text x="268" y="102" font-size="9" text-anchor="middle">-QA2 自保接點</text>
  <text x="396" y="66" font-size="10" text-anchor="middle">A1 A2</text>
  <text x="396" y="100" font-size="9" text-anchor="middle">-QA2 線圈</text>
  <text x="512" y="66" font-size="9">回控制電源另一端</text>
</svg>
